# Arm geometry, joint limits and named poses. DRAFT, 2026-11-04 (Vyom).
# Every number marked "estimate" gets replaced from the SolidWorks assembly on Sun Nov 8.
#
# Units: mm and degrees here (the loader converts to radians for arm.kinematics).
# Frame: origin = the table surface, directly under the base's rotation axis. z up, x = straight ahead.
# Joint angles are JOINT angles (see arm/kinematics/kinematics.py), not servo angles:
#   theta1 = upper arm above horizontal, theta2 = elbow bend (0 = straight, negative = elbow up),
#   theta3 = wrist bend relative to the forearm, pitch = theta1 + theta2 + theta3 (-90 = pointing down).
# Joint angle -> servo pulse lives in config/calibration.yaml (Ishaan), not here.

links:  # D14 (Nov 9): four-bar, l1 13 / l2 12 cm; l3 8.4 cm since D21 (Nov 15). Torque re-checked with SolidWorks masses: TORQUE.md "Human arm (D21)"
  l1: 130               # shoulder axis -> elbow axis
  l2: 120               # elbow axis -> wrist axis
  l3: 84                # wrist axis -> grasp point: bracket 20 + gripper 19 + 45 to the middle of the flat jaw pads (D21, Nov 15)
  shoulder_height: 174.5  # Siddharth's base (Nov 16 review): plate 6 + wheel gap 4.5 + box 70 (measured in Enclosure.SLDPRT) + tray 40 + lid 4, + 50 to the bracket's axis. Re-measure on the printed base
  shoulder_offset: 0    # shoulder bracket is centred on the turntable axis (Nov 10)

four_bar:  # D19: parallelogram elbow drive. Crank on the elbow servo = lever behind the elbow
  crank_mm: 30          # (30, not 25: at 25 the pin hole sat 1.5 mm from the horn screw). Used by the site's drawing.

# Each servo turns 180 degrees. `window` is where that 180 degrees lands in joint angles; it is
# fixed when the horn is put on (see the note at the bottom). `limits` is the part of the window
# the software allows: it stays clear of the ends and of the arm hitting itself or the table.
joints:
  j0_base:
    window: [-90, 90]
    limits: [-85, 85]
  j1_shoulder:
    window: [-30, 150]    # picks on the table use about 0..65; above 90 the arm leans back
    limits: [5, 140]
  j2_elbow:
    window: [-160, 20]    # elbow-up poses only use the negative side
    limits: [-135, -8]    # -140 lets the gripper cover hit the shoulder bracket (CAD check, Nov 16, D21); closest pick needs ~-133.
                          # Upper end -8, not 0: at theta2 = 0 the four-bar O-E-L-C goes collinear (dead point), the crank
                          # loses its moment arm and the linkage can flip, breaking forearm = theta1 + theta2 (PR #14 review, Ishaan).
  j3_wrist:
    window: [-120, 60]    # picking straight down needs about -85..+10 (workspace check, 2026-11-04)
    limits: [-90, 50]     # Arm Human (adopted Nov 17, D21): -90, its skins + cuff are checked to -90 (plain arm: -95, D19)

gripper:  # J4. Opening in mm is mapped to pulses in calibration.yaml once the gripper exists
  open_mm: 40            # fully open (rest); flat parallel jaws (D21, Nov 15)
  closed_mm: 2           # flat jaws (D21): the rack slot stops them 2 mm apart

speed_limits_deg_per_s:  # start low (CLAUDE.md section 12); widen once the arm is proven
  j0_base: 45
  j1_shoulder: 45
  j2_elbow: 45
  j3_wrist: 90
  j4_gripper: 90
gripper_speed_mm_per_s: 20  # the laptop ramp works in mm for the gripper (2-40 mm in ~1.9 s)

poses:
  # Ready pose above the middle of the pick zone, gripper pointing down. Given as a target
  # (x, y, z, pitch) so it survives link-length changes; the loader runs IK on it.
  home: {x: 150, y: 0, z: 80, pitch: -90}
  # Resting pose for arming/disarming: upper arm upright and forearm folded down, so gravity
  # barely loads the shoulder. Given as joint angles because it must not depend on IK.
  # theta3 -20, not -40: at -40 the hand dips ~5 mm into the base's 170 mm lid (Nov 16); -20 clears it by ~35.
  park: {theta0: 0, theta1: 90, theta2: -130, theta3: -20}

workspace:  # targets outside this box are rejected before IK (CLAUDE.md section 5.2)
  r_min: 150            # Nov 22: was 140; the elbow re-calibration leaves the forearm only ~75 deg below level, and the 140-145 mm low picks need ~80. Closer: the hand hits the base's 170 mm box (front face 85 out) or its 200 mm plate (Nov 16)
  r_max: 220            # on the 174.5 base, 240 at z = 25 is nearly straight (elbow ~-11): sloppy + four-bar dead point; 230 keeps ~-34
  z_min: 25             # grasp point = middle of the finger pads; the longest fingertip is 20 below it (D21), so 25 keeps it 5 above the table
  z_max: 250

base_clearance:  # D23 (Nov 17): poses inside the joint limits that still hit Siddharth's base (arm/clearance.py)
  # All in the arm's vertical plane, from the SHOULDER AXIS (so shoulder_height doesn't matter).
  lid_below_shoulder: 50          # lid top is 50 below the shoulder axis: the bracket's axis is 50.0 above its underside
  box_half: 85                    # 170 mm square box (+ tray + lid), turns with the arm
  plate_r: 100                    # fixed base plate reaches 100 mm from the axis
  plate_top_below_shoulder: 168.5 # plate top 6 mm above the table, shoulder axis 174.5 above it (CAD, Nov 17)
  forearm_half_width: 18          # Arm Human forearm skin: +-18 mm around the elbow -> wrist line
  hand_origin_from_wrist: 39      # gripper frame origin on the approach line, 39 mm out from the wrist axis
  hand_body: [40, -19, 24]        # body / palm cover: |u| <= 40, v from -19 to 24 along the approach
  hand_fingers: [32, 24, 65]      # flat fingers: |u| <= 32, v from 24 to 65
  margin: 3                       # grow every obstacle by this much; the 2D model matched the 20-pose CAD check

# Assembly note for the CAD and the build: the window centre is where the servo sits at 1500 us.
# Put each horn on with the servo at 1500 us and the joint at its window centre:
#   base 0 (facing forward), shoulder 60, elbow -70, wrist -30.
