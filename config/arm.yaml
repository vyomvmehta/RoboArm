# Arm geometry, joint limits and named poses. DRAFT, 2026-11-04 (Vyom).
# Every number marked "estimate" gets replaced from the SolidWorks assembly on Sun Nov 8.
#
# Units: mm and degrees here (the loader converts to radians for arm.kinematics).
# Frame: origin = the table surface, directly under the base's rotation axis. z up, x = straight ahead.
# Joint angles are JOINT angles (see arm/kinematics/kinematics.py), not servo angles:
#   theta1 = upper arm above horizontal, theta2 = elbow bend (0 = straight, negative = elbow up),
#   theta3 = wrist bend relative to the forearm, pitch = theta1 + theta2 + theta3 (-90 = pointing down).
# Joint angle -> servo pulse lives in config/calibration.yaml (Ishaan), not here.

links:  # D14 ON HOLD (Nov 5): 11 / 10 / 7 cm until the servo torque test; may grow (four-bar or stronger servo)
  l1: 110               # shoulder axis -> elbow axis
  l2: 100               # elbow axis -> wrist axis
  l3: 70                # wrist axis -> grasp point between the jaws
  shoulder_height: 90   # shoulder axis above the table. Estimate: base enclosure + turntable + shoulder bracket
  shoulder_offset: 15   # shoulder axis forward of the base axis. Estimate

# Each servo turns 180 degrees. `window` is where that 180 degrees lands in joint angles; it is
# fixed when the horn is put on (see the note at the bottom). `limits` is the part of the window
# the software allows: it stays clear of the ends and of the arm hitting itself or the table.
joints:
  j0_base:
    window: [-90, 90]
    limits: [-85, 85]
  j1_shoulder:
    window: [-30, 150]    # picks on the table use about 0..65; above 90 the arm leans back
    limits: [-20, 140]
  j2_elbow:
    window: [-160, 20]    # elbow-up poses only use the negative side
    limits: [-145, 0]     # -145: forearm folded nearly onto the upper arm (check in CAD for collision)
  j3_wrist:
    window: [-120, 60]    # picking straight down needs about -85..+10 (workspace check, 2026-11-04)
    limits: [-110, 50]

gripper:  # J4. Opening in mm is mapped to pulses in calibration.yaml once the gripper exists
  open_mm: 40           # estimate, from Siddharth's gripper CAD
  closed_mm: 0

speed_limits_deg_per_s:  # start low (CLAUDE.md section 12); widen once the arm is proven
  j0_base: 45
  j1_shoulder: 45
  j2_elbow: 45
  j3_wrist: 90
  j4_gripper: 90

poses:
  # Ready pose above the middle of the pick zone, gripper pointing down. Given as a target
  # (x, y, z, pitch) so it survives link-length changes; the loader runs IK on it.
  home: {x: 150, y: 0, z: 80, pitch: -90}
  # Resting pose for arming/disarming: upper arm upright and forearm folded down, so gravity
  # barely loads the shoulder. Given as joint angles because it must not depend on IK.
  park: {theta0: 0, theta1: 90, theta2: -130, theta3: -40}

workspace:  # targets outside this box are rejected before IK (CLAUDE.md section 5.2)
  r_min: 90             # closer than this, the gripper meets the base (base radius ~60 mm, estimate)
  r_max: 210            # IK reaches ~224 when picking at z = 15, but a nearly straight arm is sloppy
  z_min: 5              # never drive the jaws into the table
  z_max: 250

# Assembly note for the CAD and the build: the window centre is where the servo sits at 1500 us.
# Put each horn on with the servo at 1500 us and the joint at its window centre:
#   base 0 (facing forward), shoulder 60, elbow -70, wrist -30.
