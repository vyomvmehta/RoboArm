# Joint angle (degrees) -> servo pulse (microseconds), per joint.  DRAFT 2026-11-08 (Vyom).
# OWNER: Ishaan (D8). Every number here is a placeholder until he measures the real arm.
# This file is part of the contract between the laptop and the firmware: don't change it
# without telling the other side.
#
#   center_us:   the pulse the horn was fitted at = the joint's window centre in config/arm.yaml.
#                A per-joint center_us overrides the top-level one.
#   direction:   +1 if a LONGER pulse moves the joint toward MORE POSITIVE angles, else -1
#   us_per_deg:  pulse change per degree of joint motion (measured, see below)
#   min_us/max_us: never send a pulse outside these. Kept 50 us INSIDE the firmware hard limits
#                (PULSE_MIN/PULSE_MAX in arm_controller.ino), which sit AT each servo's measured
#                travel (agreed Nov 13, PR #8), so the firmware only ever trips on a laptop bug.
#
# MEASURED SERVO TRAVEL (bench, servo alone, no arm):
#   MG996R 180 (J0-J2), all four units, Ishaan Nov 13: 180 deg = 400-2450 us -> 11.4 us/deg,
#                       mid-travel 1425 us.
#   MG90S (J3-J4), both units, Vyom Nov 10:            180 deg = 650-2600 us -> 10.8 us/deg,
#                       mid-travel 1625 us (end stop near 500).
#
# PROVISIONAL (Nov 13, Vyom + Claude): per-servo-type values from the bench numbers above, not
# yet measured on the assembled arm. Horns go on at each servo's mid-travel (1425 / 1625, not a
# blanket 1500), so each joint's window centre lands there. Replace every number at calibration
# (Nov 22-23). MERGE ONLY AFTER PR #8 (firmware limits 400/2450, 500/2600): the test
# test_calibration_range_sits_inside_the_firmware_limits enforces that order.

center_us: 1500   # fallback only; every joint below sets its own

joints:
  j0_base:     {center_us: 1425, direction: 1,  us_per_deg: 11.4, min_us: 450, max_us: 2400}  # MG996R
  j1_shoulder: {center_us: 1425, direction: 1,  us_per_deg: 11.4, min_us: 450, max_us: 2400}  # MG996R
  j2_elbow:    {center_us: 1425, direction: -1, us_per_deg: 11.4, min_us: 450, max_us: 2400}  # MG996R; four-bar -> servo sets the forearm's ABSOLUTE angle (theta1 + theta2), rework at calibration
  j3_wrist:    {center_us: 1625, direction: 1,  us_per_deg: 10.8, min_us: 550, max_us: 2550}  # MG90S

gripper:  # opening in mm -> pulse. Curled tilting fingers (D17, Nov 12): 26-40 mm = 7 mm of rack
          # travel = 33.4 deg of servo turn = ~361 us at 10.8 us/deg, centred on the MG90S's 1625
          # until the horn is fitted and the real closed/open pulses are measured. Which end is
          # "closed" depends on how the pinion goes on: swap the two if it closes the wrong way.
          # Pairs with arm.yaml gripper closed_mm 26 / open_mm 40 (on cad/gripper).
  closed_us: 1445
  open_us: 1805
