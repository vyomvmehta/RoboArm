# Joint angle (degrees) -> servo pulse (microseconds), per joint.  DRAFT 2026-11-08 (Vyom).
# OWNER: Ishaan (D8). Every number here is a placeholder until he measures the real arm.
# This file is part of the contract between the laptop and the firmware: don't change it
# without telling the other side.
#
#   center_us:   the pulse the horn was fitted at = the joint's window centre in config/arm.yaml.
#                A per-joint center_us overrides the top-level one.
#   direction:   +1 if a LONGER pulse moves the joint toward MORE POSITIVE angles, else -1
#   us_per_deg:  pulse change per degree of SERVO motion (measured, see below). For a geared joint
#                (gear_ratio in arm.yaml, D22: the base is 2.25) the code divides by the ratio,
#                so the base moves at 11.3889 / 2.25 = ~5.06 us per base degree.
#   min_us/max_us: never send a pulse outside these. Kept 50 us INSIDE the firmware hard limits
#                (PULSE_MIN/PULSE_MAX in arm_controller.ino, 450-2500 on every joint, PR #8),
#                which sit AT the servos' measured travel, so the firmware only trips on a bug.
#
# MEASURED SERVO TRAVEL (Ishaan, Nov 13, bench, servo alone, no arm): every servo, MG996R 180
# (J0-J2) and MG90S (J3-J4) alike, sweeps 180 deg between 450 and 2500 us
#   -> 2050 us / 180 deg = 11.3889 us/deg (not rounded to 11.4: that puts a 180 deg window's ends at 449/2501, outside the firmware limits), mid-travel 1475 us.
# (Supersedes the earlier single readings: MG996R 400-2450, MG90S 650-2600.)
#
# PROVISIONAL (Nov 13, Vyom + Claude): from the bench numbers above, not yet measured on the
# assembled arm. Horns go on with each servo at 1475 us (its mid-travel, not 1500), so each
# joint's window centre lands there. Replace every number at calibration (Nov 22-23).
# MERGE ONLY AFTER PR #8 (firmware limits 450-2500): the test
# test_calibration_range_sits_inside_the_firmware_limits enforces that order.

center_us: 1475   # every servo's measured mid-travel; a joint may override it below

joints:
  j0_base:     {center_us: 1475, direction: 1,  us_per_deg: 11.3889, min_us: 500, max_us: 2450}  # MG996R, geared 2.25:1
  # D22: the base servo is mounted shaft-down in the turntable, so direction may need to be -1.
  # CHECK ON THE BENCH: a longer pulse must turn the base toward +theta0 (counter-clockwise from above).
  j1_shoulder: {center_us: 1475, direction: 1,  us_per_deg: 11.3889, min_us: 500, max_us: 2450}  # MG996R
  j2_elbow:    {center_us: 1475, direction: -1, us_per_deg: 11.3889, min_us: 500, max_us: 2450,  # MG996R
                four_bar_window: [-100, 80]}
  # FOUR-BAR (D19, Nov 15): the elbow servo sits at the shoulder and, through the parallel rod,
  # sets the forearm's ABSOLUTE angle above horizontal = theta1 + theta2, not the bend theta2.
  # four_bar_window is that absolute angle's 180 deg servo window (replaces arm.yaml's
  # j2 window for the pulse maths; arm.yaml's window still limits the bend in IK).
  # PROVISIONAL: centre -10 deg = home pose (60 - 70); park is -40. Fit the horn so 1475 us
  # puts the forearm 10 deg below horizontal, then re-measure at calibration.
  j3_wrist:    {center_us: 1475, direction: 1,  us_per_deg: 11.3889, min_us: 500, max_us: 2450}  # MG90S

gripper:  # opening in mm -> pulse. Curled tilting fingers (D17, Nov 12): 26-40 mm = 7 mm of rack
          # travel = 33.4 deg of servo turn = ~381 us at 11.39 us/deg, centred on 1475 until the
          # horn is fitted and the real closed/open pulses are measured. Which end is "closed"
          # depends on how the pinion goes on: swap the two if it closes the wrong way.
          # Pairs with arm.yaml gripper closed_mm 26 / open_mm 40 (set in this PR, same as cad/gripper).
  closed_us: 1285
  open_us: 1665
