<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoboArm</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#f5f6f4;color:#1d211f}
  .row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;margin:14px 0}
  input[type=range]{width:100%;height:32px}  /* tall enough for a thumb on a phone */
  input[type=range]:disabled{opacity:.4}
  .val{font-family:monospace;text-align:right}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;cursor:pointer}
  #arm{background:#2c8256;color:#fff} #disarm{background:#c0392b;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  #state{font-family:monospace;font-weight:600;padding:6px 10px;border-radius:6px;background:#dde2dd}
  #state.ARMED{background:#2c8256;color:#fff} #state.HOLD{background:#e0a100;color:#000}
  #state.FAULT,#state.DISCONNECTED{background:#c0392b;color:#fff}
  #info,#msg{font-family:monospace;font-size:.85rem;color:#5d6560;white-space:pre-wrap}
  #msg.err{color:#c0392b}
</style></head>
<body>
<h1>RoboArm</h1>
<div class="bar">
  <span id="state">connecting...</span>
  <button id="arm">Arm</button>
  <button id="disarm" disabled>Disarm</button>
</div>
<div id="info"></div>
<div id="sliders"></div>
<div id="msg"></div>

<script>
// ---------- connection ----------
const sock = new WebSocket(`ws://${location.host}/ws`);
const $ = (id) => document.getElementById(id);
const say = (text, err) => { $("msg").textContent = text; $("msg").className = err ? "err" : ""; };
let armed = false;

function setArmed(a) {             // sliders only work while armed
  armed = a;
  $("arm").disabled = a; $("disarm").disabled = !a;
  document.querySelectorAll("input[type=range]").forEach(s => s.disabled = !a);
}

sock.onclose = () => { $("state").textContent = "disconnected: reload"; $("state").className = "DISCONNECTED"; setArmed(false); };
sock.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === "status") {       // pushed by the server 5x a second
    $("state").textContent = m.state; $("state").className = m.state;
    if (m.armed !== armed) setArmed(m.armed);
    $("info").textContent =
      `firmware ${m.firmware || "?"} · round trip ${m.rtt_ms ?? "-"} ms` +
      (m.target_us ? `\nsending (us): ${m.target_us.join(", ")}` : "") +
      (m.error ? `\nlast Nano error: ${m.error}` : "");
  } else if (m.type === "pose") {   // armed: the server is sending PARK, show it on the sliders
    setSliders(m.values); say("armed at the park pose");
  } else if (m.type === "error") {
    say(m.msg, true);
  } else if (m.type === "busy") {
    say("someone else is controlling the arm from another browser", true);
  }
};
$("arm").onclick = () => sock.send(JSON.stringify({type: "arm"}));
$("disarm").onclick = () => sock.send(JSON.stringify({type: "disarm"}));

// ---------- THROTTLE (from step 2) ----------
// Slider events fire on every pixel. They only UPDATE `latest`; a timer sends at most
// 30 times a second, and only the newest values.
const SEND_HZ = 30;
let latest = [];
let dirty = false;
setInterval(() => {
  if (!dirty || !armed || sock.readyState !== WebSocket.OPEN || sock.bufferedAmount > 0) return;
  sock.send(JSON.stringify({type: "joints", deg: latest}));
  dirty = false;
}, 1000 / SEND_HZ);

// ---------- sliders, built from the server's /config ----------
const inputs = [];
function setSliders(values) {
  values.forEach((v, i) => { latest[i] = v; inputs[i].value = v; inputs[i].nextElementSibling.textContent = Math.round(v); });
  dirty = false;
}
fetch("/config").then(r => r.json()).then(({sliders}) => {
  sliders.forEach((s, i) => {
    latest[i] = s.start;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label>${s.name}</label>
      <input type="range" min="${s.min}" max="${s.max}" step="1" value="${s.start}" disabled>
      <span class="val">${Math.round(s.start)}</span>`;
    const input = row.querySelector("input"), val = row.querySelector(".val");
    inputs.push(input);
    input.addEventListener("input", () => {
      latest[i] = Number(input.value); val.textContent = input.value; dirty = true;
    });
    $("sliders").appendChild(row);
  });
});
</script>
</body></html>
